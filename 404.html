<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found · Simranjeet Singh</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#090e18">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Martian+Mono:wdth,wght@75..112.5,400..800&display=swap">
<style>
:root { --bg:#090e18; --surface:#101827; --line:#1e2a3f; --line-2:#2a3851; --ink:#e8edf5; --muted:#94a1b6; --faint:#66748c;
  --accent:#f5b32b; --accent-ink:#1b1300; --err:#ff7b7b; --kw:#7cb9ff; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
  font:16px/1.6 'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  padding: 32px max(20px, env(safe-area-inset-right, 0px)) 32px max(20px, env(safe-area-inset-left, 0px)); }
.dump { width:min(680px, 100%); border:1px solid var(--line-2); border-radius:14px; overflow:hidden; background:#070b13; }
.bar { display:flex; gap:10px; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line); background:#0d1421;
  font:12px 'JetBrains Mono', ui-monospace, monospace; color:var(--faint); }
.bar b { color:var(--accent); font-weight:600; }
.in { padding:22px 22px 24px; font:14px/1.75 'JetBrains Mono', ui-monospace, monospace; }
h1 { margin:0 0 8px; font:800 clamp(22px, 5vw, 30px)/1.15 'Martian Mono', 'JetBrains Mono', monospace; font-stretch:87.5%; letter-spacing:-.04em; color:var(--err); }
.k { color:var(--kw); } .m { color:var(--muted); } .lbl { color:var(--faint); text-transform:uppercase; font-size:11px; letter-spacing:.12em; margin-top:16px; }
p { margin:0; }
a.btn { display:inline-flex; align-items:center; gap:8px; margin-top:20px; height:42px; padding:0 16px; border-radius:10px;
  background:var(--accent); color:var(--accent-ink); font:600 14px 'JetBrains Mono', monospace; text-decoration:none; }
</style>
</head>
<body>
<main class="dump">
  <div class="bar"><b>404</b> simranjeet@unbrako: ~</div>
  <div class="in">
    <h1>Page not found</h1>
    <p class="m">The page <span class="k" id="path">you requested</span> does not exist.</p>
    <a class="btn" href="/">Back to portfolio →</a>
  </div>
</main>
<script>try{document.getElementById('path').textContent=location.pathname}catch(e){}</script>
</body>
</html>
